<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay-Contato</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>
        <a href="../index.html" class="nav-logo">TripWay</a>

        <ul class="nav-links">
            <li><a href="destinos.html">Destinos</a></li>
            <li><a href="pacotes.html">Pacotes</a></li>
            <li><a href="contato.html">Reserva</a></li>
        </ul>
    </nav>

    <main>
        <section>

            <h1>Faça sua reserva conosco agora</h1>

            <img src="../images/banner-reserva.jpeg" alt="Banner de reservas" class="banner-img" style="margin: 1rem auto;">

            <form>
                <h2>Informações para Reserva</h2>

                <label>Nome:</label>
                <input type="text" required>

                <label>E-mail:</label>
                <input type="email" required>

                <label>Destino de interesse:</label>
                <select>
                    <option>São Paulo</option>
                    <option>Rio de Janeiro</option>
                    <option>Salvador</option>
                </select>

                <label>Data:</label>
                <input type="date" required>

                <label>Quantidade de pessoas:</label>
                <input type="number" required>

                <label>Mensagem:</label>
                <textarea placeholder="Deixe sua mensagem..."></textarea>

                <button type="submit">
                    Envie sua Reserva
                </button>
            </form>

            <a href="../index.html">
                ← Voltar
            </a>

        </section>
    </main>
    <footer>

        <p>© 2026 TripWay - Todos os direitos reservados</p>

        <p>
            Contato: tripway@email.com
        </p>

        <div>
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">WhatsApp</a>
        </div>

    </footer>

</body>

</html>
