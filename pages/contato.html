<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay-Contato</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>
        <a href="../index.html" class="nav-logo">TripWay</a>

        <ul class="nav-links">
            <li><a href="destinos.html">Destinos</a></li>
            <li><a href="pacotes.html">Pacotes</a></li>
            <li><a href="contato.html">Reserva</a></li>
        </ul>
    </nav>

    <main>
        <section>

            <h1>Faça sua reserva conosco agora</h1>

            <img src="../images/banner-reserva.jpeg" alt="Banner de reservas" class="banner-img"
                style="margin: 1rem auto;">

            <form id="form-reserva">
                <h2>Informações para Reserva</h2>

                <div class="form-grupo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="form-grupo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="form-grupo">
                    <label for="destino">Destino de interesse:</label>
                    <select id="destino" name="destino">
                        <option>São Paulo</option>
                        <option>Rio de Janeiro</option>
                        <option>Salvador</option>
                    </select>
                </div>

                <div class="form-grupo">
                    <label for="data">Data:</label>
                    <input type="date" id="data" name="data" required>
                </div>

                <div class="form-grupo">
                    <label for="pessoas">Quantidade de pessoas:</label>
                    <input type="number" id="pessoas" name="pessoas" min="1" max="5" placeholder="Ex: 2" required>
                </div>

                <div class="form-grupo">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Deixe sua mensagem..."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Reserva</button>
                
            </form>

            <a href="../index.html">
                ← Voltar
            </a>

        </section>
    </main>
    <footer>

        <p>© 2026 TripWay - Todos os direitos reservados</p>

        <p>
            Contato: tripway@email.com
        </p>

        <div>
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">WhatsApp</a>
        </div>

    </footer>

</body>

</html>
